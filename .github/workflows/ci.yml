name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o bin/blx ./cmd/server

      - name: Build (Windows, only on Linux)
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build -o bin/blx.exe ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blx-${{ runner.os }}
          path: bin/
          if-no-files-found: error
