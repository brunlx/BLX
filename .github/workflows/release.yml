name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Embed resources (Windows)
        if: matrix.goos == 'windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go-winres make --in winres/winres.json --out cmd/server/rsrc --arch amd64 \
            --product-version="$VERSION" --file-version="$VERSION"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/blx-${{ matrix.target }}${{ matrix.ext }}" ./cmd/server

      - name: Archive (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar -czf "blx-${{ matrix.target }}.tar.gz" "blx-${{ matrix.target }}"

      - name: Archive (zip)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip "blx-${{ matrix.target }}.zip" "blx-${{ matrix.target }}.exe"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: blx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
